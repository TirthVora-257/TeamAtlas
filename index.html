<title>HowToLife</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Unbounded:wght@500;700&family=Figtree:wght@400;500;600;700&family=IBM+Plex+Mono:wght@500;600&display=swap" rel="stylesheet">
<style>
/* Layout: a full-bleed 3D stage for play; a stage + paper panel for reading screens. */
:root{
  --ivory:#F4EEE2; --paper:#FBF8F1; --paper2:#F0E8D9; --ink:#24242A; --ink2:#5A554C; --line:#DDD2BF;
  --terra:#B4553A; --terra-d:#8E3F2A; --teal:#2C6B66; --teal-d:#1F4E4A; --leaf:#4B8641; --monsoon:#33608D; --gold:#B8862A; --warn:#9E3B26;
  --glass:rgba(251,248,241,.94);
  --f-display:"Unbounded","Arial Black",system-ui,sans-serif;
  --f-body:"Figtree",system-ui,-apple-system,"Segoe UI",sans-serif;
  --f-mono:"IBM Plex Mono",ui-monospace,Menlo,Consolas,monospace;
  --hdr:62px;
  color-scheme:light;
}
*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{background:var(--ivory);color:var(--ink)}
body{font-family:var(--f-body);font-size:15px;line-height:1.5;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:0 16px}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--ivory)}
button,input,select{font:inherit;color:inherit}
:focus-visible{outline:3px solid var(--monsoon);outline-offset:2px}
[tabindex="-1"]:focus{outline:none}
.num{font-family:var(--f-mono);font-variant-numeric:tabular-nums}

.bar{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:var(--ivory);display:flex;flex-wrap:wrap;align-items:center;gap:8px 16px;padding-block:10px;border-bottom:1px solid var(--line);margin-bottom:12px}
.logo{display:flex;align-items:center;gap:10px;font-family:var(--f-display);font-weight:700;font-size:18px;background:none;border:0;padding:0;cursor:pointer}
.cube{width:22px;height:22px;position:relative;flex:none}
.cube i{position:absolute;display:block}
.cube i:nth-child(1){left:8px;top:0;width:16px;height:9px;background:#D98A68;transform:skewX(-30deg) scaleY(.9);transform-origin:bottom left}
.cube i:nth-child(2){left:2px;top:7px;width:9px;height:13px;background:var(--terra);transform:skewY(30deg)}
.cube i:nth-child(3){left:11px;top:7px;width:9px;height:13px;background:var(--terra-d);transform:skewY(-30deg)}
.steps{display:flex;gap:4px;list-style:none;margin:0;padding:0;flex-wrap:wrap}
.steps li{font-size:12px;font-weight:600;color:var(--ink2);padding:4px 8px;border-radius:3px;white-space:nowrap}
.steps li b{font-family:var(--f-mono);margin-right:4px}
.steps li[aria-current="step"]{background:var(--ink);color:var(--paper)}
.tools{margin-left:auto;display:flex;gap:6px;flex-wrap:wrap}
.chip{border:1px solid var(--line);background:var(--paper);border-radius:3px;padding:5px 10px;font-size:13px;font-weight:600;cursor:pointer}
.chip[aria-pressed="true"]{background:var(--teal);color:#fff;border-color:var(--teal)}

.app{display:grid;grid-template-columns:minmax(0,1.45fr) minmax(0,1fr);grid-template-areas:"stage panel" "below panel";gap:14px 20px;align-items:start;max-width:1400px;margin:0 auto}
.app.full{grid-template-columns:minmax(0,1fr);grid-template-areas:"stage"}
.app.full .panel,.app.full .below{display:none}
.stage{grid-area:stage;position:relative;border-radius:4px;overflow:hidden;aspect-ratio:16/11;max-height:72vh;width:100%;background:#cfd8dc;border:1px solid var(--line);touch-action:none;user-select:none;-webkit-user-select:none}
.app.full .stage{aspect-ratio:auto;max-height:none;height:calc(100dvh - var(--hdr) - 28px);min-height:440px}
.stage canvas#gl{display:block;width:100%;height:100%}
.panel{grid-area:panel;min-width:0;background:var(--paper);border:1px solid var(--line);border-radius:4px;padding:20px 20px 22px}
.below{grid-area:below;min-width:0}
@media (max-width:880px){
  .app{grid-template-columns:minmax(0,1fr);grid-template-areas:"stage" "panel" "below"}
  .stage{aspect-ratio:4/3;max-height:none}
  .steps li span{display:none}
}

/* Overlays on the stage */
.ov{position:absolute;pointer-events:none}
.ov > *{pointer-events:auto}
.hud-tl{left:10px;top:10px;display:flex;flex-direction:column;gap:6px;max-width:min(320px,60%)}
.hud-tr{right:10px;top:10px}
.card-g{background:var(--glass);border-radius:4px;padding:7px 11px;box-shadow:0 2px 0 rgba(0,0,0,.14)}
.clock .t{font-family:var(--f-display);font-weight:700;font-size:22px;line-height:1}
.clock .p{font-size:12px;font-weight:600;color:var(--ink2);margin-top:3px}
.stats{display:grid;grid-template-columns:auto auto;gap:2px 12px;font-size:12px;margin:0}
.stats dt{color:var(--ink2);font-weight:600}
.stats dd{margin:0;text-align:right;font-family:var(--f-mono);font-weight:600}
.meter{display:inline-flex;gap:2px;vertical-align:middle;margin-right:6px}
.meter i{width:7px;height:10px;background:#D7CCB8;display:block}
.meter i.on{background:var(--leaf)}
.meter.low i.on{background:var(--warn)}
.objs{font-size:12.5px;list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:3px}
.objs li{display:flex;gap:6px;align-items:baseline}
.objs li::before{content:"";width:9px;height:9px;flex:none;background:var(--terra);transform:translateY(1px)}
.objs li.done{color:var(--ink2);text-decoration:line-through}
.objs li.done::before{background:var(--leaf)}
.objs li.exit::before{background:var(--gold)}
.mini{right:10px;bottom:10px;width:150px;height:150px;border-radius:4px;background:rgba(36,36,42,.72);box-shadow:0 2px 0 rgba(0,0,0,.2)}
.prompt{left:50%;bottom:18px;transform:translateX(-50%);display:flex;gap:8px;align-items:center}
.keycap{display:inline-grid;place-items:center;min-width:26px;height:26px;padding:0 6px;background:var(--ink);color:var(--paper);font-family:var(--f-mono);font-weight:600;font-size:13px;border-radius:3px;box-shadow:0 2px 0 #000}
.pbtn{border:0;background:var(--glass);border-radius:4px;padding:8px 14px 8px 8px;font-weight:700;display:flex;gap:10px;align-items:center;box-shadow:0 3px 0 rgba(0,0,0,.25);cursor:pointer}
.toast{left:50%;bottom:70px;transform:translateX(-50%);display:flex;flex-direction:column;gap:6px;align-items:center}
.toast div{background:var(--ink);color:var(--paper);font-size:13px;font-weight:600;padding:7px 12px;border-radius:3px;box-shadow:0 2px 0 #000;animation:tin .25s ease-out}
@keyframes tin{from{transform:translateY(-6px);opacity:0}}
.hint{left:10px;bottom:10px;font-size:12px;color:var(--ink);max-width:60%}
.hint span{background:var(--glass);padding:4px 8px;border-radius:3px;display:inline-block}
.dlg{left:50%;bottom:16px;transform:translateX(-50%);width:min(600px,calc(100% - 24px));max-height:calc(100% - 32px);overflow:auto;background:var(--paper);border-radius:5px;box-shadow:0 10px 40px rgba(0,0,0,.3),0 3px 0 rgba(0,0,0,.25);padding:16px 18px 18px;display:flex;flex-direction:column;gap:10px}
.dlg .who{font-size:11px;letter-spacing:.12em;text-transform:uppercase;font-weight:700;color:var(--terra)}
.modal{inset:0;display:grid;place-items:center;background:rgba(30,30,36,.35);padding:12px}
.modal > .sheet{background:var(--paper);border-radius:5px;width:min(860px,100%);max-height:100%;overflow:auto;padding:18px 20px 20px;box-shadow:0 20px 60px rgba(0,0,0,.35);display:flex;flex-direction:column;gap:12px}
.routes{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:10px}
.route{border:2px solid var(--line);border-radius:4px;background:var(--ivory);padding:12px;text-align:left;cursor:pointer;display:flex;flex-direction:column;gap:6px}
.route[aria-pressed="true"]{border-color:var(--teal);background:#E6EFEC}
.route .big{display:flex;justify-content:space-between;gap:8px;align-items:baseline}
.route .big b{font-family:var(--f-display);font-size:18px}
.legs{list-style:none;margin:0;padding:0;font-size:12.5px;display:flex;flex-direction:column;gap:2px}
.legs li{display:grid;grid-template-columns:auto minmax(0,1fr) auto;gap:8px}
.mode{font-family:var(--f-mono);font-size:11px;font-weight:600;background:var(--ink);color:var(--paper);padding:0 5px;border-radius:2px;align-self:center}
.late{color:var(--warn);font-weight:700}
.ontime{color:var(--leaf);font-weight:700}

/* Character select */
.sel{inset:0;display:grid;grid-template-columns:minmax(0,270px) minmax(0,1fr) minmax(0,360px);gap:12px;padding:12px}
.sel .roster{pointer-events:auto;overflow:auto;display:flex;flex-direction:column;gap:6px;padding-right:2px}
.sel .info{pointer-events:auto;overflow:auto;align-self:stretch}
.sel .mid{pointer-events:none;display:flex;flex-direction:column;justify-content:flex-end;align-items:center;gap:8px;padding-bottom:6px}
.av{display:flex;gap:10px;align-items:center;text-align:left;border:2px solid transparent;background:var(--glass);border-radius:4px;padding:6px 8px;cursor:pointer;box-shadow:0 2px 0 rgba(0,0,0,.14)}
.av[aria-pressed="true"]{border-color:var(--terra);background:#fff}
.av .n{font-weight:700;font-size:13.5px;line-height:1.2}
.av .r{font-size:11.5px;color:var(--ink2);line-height:1.2}
.face{width:30px;height:38px;position:relative;flex:none}
.face i{position:absolute;display:block}
.face .h{left:7px;top:0;width:16px;height:5px;background:var(--h)}
.face .k{left:7px;top:4px;width:16px;height:14px;background:var(--k)}
.face .b{left:3px;top:18px;width:24px;height:20px;background:var(--s)}
.infocard{background:var(--paper);border-radius:5px;padding:16px;box-shadow:0 3px 0 rgba(0,0,0,.18);display:flex;flex-direction:column;gap:10px}
.statrow{display:grid;grid-template-columns:7.5em minmax(0,1fr) auto;gap:8px;align-items:center;font-size:12.5px}
.statbar{height:8px;background:var(--paper2);position:relative}
.statbar i{position:absolute;left:0;top:0;bottom:0;background:var(--teal)}
.swatches{display:flex;gap:6px;flex-wrap:wrap}
.sw{width:28px;height:28px;border-radius:3px;border:2px solid var(--line);cursor:pointer}
.sw[aria-pressed="true"]{border-color:var(--ink);box-shadow:0 0 0 2px var(--paper) inset}
.segs{display:flex;gap:4px;flex-wrap:wrap}
.segs button{border:1px solid var(--line);background:var(--ivory);border-radius:3px;padding:5px 9px;font-size:12.5px;font-weight:600;cursor:pointer}
.segs button[aria-pressed="true"]{background:var(--teal);color:#fff;border-color:var(--teal-d)}
@media (max-width:880px){
  .sel{grid-template-columns:minmax(0,1fr);grid-template-rows:auto minmax(0,1fr) auto;padding:8px}
  .sel .roster{flex-direction:row;overflow-x:auto;overflow-y:hidden}
  .sel .av{flex:none}
  .sel .info{position:absolute;left:8px;right:8px;bottom:8px;max-height:50%}
  .hud-tr .commits,.hud-tr .row{display:none}
  .hud-tl{max-width:48%}
  .toast{bottom:auto;top:120px}
  .toast div:not(:last-child){display:none}
  .sel .mid{display:none}
  .mini{width:96px;height:96px}
  .hint{display:none}
}

/* Touch controls */
.touch{inset:auto 0 0 0;height:0}
.joy{position:absolute;left:18px;bottom:18px;width:120px;height:120px;border-radius:50%;background:rgba(36,36,42,.25);border:2px solid rgba(255,255,255,.5);pointer-events:auto;touch-action:none}
.joy i{position:absolute;left:40px;top:40px;width:40px;height:40px;border-radius:50%;background:rgba(251,248,241,.9)}
.actbtn{position:absolute;right:18px;bottom:180px;width:64px;height:64px;border-radius:50%;border:0;background:var(--terra);color:#fff;font-weight:700;font-size:18px;pointer-events:auto;box-shadow:0 3px 0 var(--terra-d)}

/* Shared text + controls */
.eyebrow{font-size:11px;letter-spacing:.12em;text-transform:uppercase;font-weight:700;color:var(--terra)}
h1,h2,h3{text-wrap:balance;margin:0}
h1{font-family:var(--f-display);font-weight:700;font-size:clamp(22px,2.8vw,30px);line-height:1.12;letter-spacing:-.015em}
h2{font-family:var(--f-display);font-weight:500;font-size:19px;line-height:1.2}
h3{font-size:15px;font-weight:700}
p{margin:0}
.lede{color:var(--ink2);max-width:62ch}
.stack{display:flex;flex-direction:column;gap:14px}
.stack-s{display:flex;flex-direction:column;gap:8px}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.muted{color:var(--ink2)}
.small{font-size:13px}
.tiny{font-size:12px}
hr{border:0;border-top:1px solid var(--line);margin:2px 0}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;border:0;border-radius:3px;padding:10px 16px 11px;font-weight:700;cursor:pointer;background:var(--ink);color:var(--paper);box-shadow:0 3px 0 #000;transition:transform .08s,box-shadow .08s}
.btn:active{transform:translateY(3px);box-shadow:0 0 0 #000}
.btn.terra{background:var(--terra);box-shadow:0 3px 0 var(--terra-d)}
.btn.teal{background:var(--teal);box-shadow:0 3px 0 var(--teal-d)}
.btn.ghost{background:var(--paper);color:var(--ink);box-shadow:0 3px 0 var(--line);border:1px solid var(--line)}
.btn.sm{padding:6px 10px 7px;font-size:13px}
.btn[disabled]{opacity:.45;cursor:not-allowed}
.link{background:none;border:0;padding:0;color:var(--monsoon);font-weight:600;text-decoration:underline;text-underline-offset:3px;cursor:pointer}
.choices{display:flex;flex-direction:column;gap:8px}
.choice{display:grid;grid-template-columns:auto minmax(0,1fr);gap:2px 12px;text-align:left;border:1px solid var(--line);background:var(--ivory);border-radius:3px;padding:10px 12px;cursor:pointer;box-shadow:0 3px 0 var(--line)}
.choice:hover{border-color:var(--ink2)}
.choice .k{grid-row:span 2;width:24px;height:24px;display:grid;place-items:center;background:var(--ink);color:var(--paper);font-family:var(--f-mono);font-weight:600;font-size:12px;border-radius:2px}
.choice small{color:var(--ink2);font-size:12.5px}
.deltas{display:flex;flex-wrap:wrap;gap:6px}
.delta{font-family:var(--f-mono);font-size:12px;font-weight:600;padding:3px 7px;border-radius:2px;background:var(--paper2);border:1px solid var(--line)}
.commits{display:flex;flex-wrap:wrap;gap:6px}
.commit{font-size:12px;font-weight:600;padding:3px 8px;border-radius:3px;border:1px dashed var(--ink2);background:var(--glass)}
.commit.kept{border-style:solid;border-color:var(--leaf);color:var(--leaf)}
.commit.missed{border-style:solid;border-color:var(--warn);color:var(--warn)}

fieldset{border:0;padding:0;margin:0;min-width:0}
legend{font-size:12px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:var(--ink2);margin-bottom:6px;padding:0}
.seg{display:flex;flex-wrap:wrap;gap:6px}
.seg label{position:relative}
.seg input{position:absolute;opacity:0;inset:0;margin:0;cursor:pointer}
.seg span{display:block;border:1px solid var(--line);background:var(--ivory);border-radius:3px;padding:6px 10px;font-size:13px;font-weight:600;box-shadow:0 2px 0 var(--line)}
.seg input:checked+span{background:var(--teal);color:#fff;border-color:var(--teal-d);box-shadow:0 2px 0 var(--teal-d)}
.seg input:focus-visible+span{outline:3px solid var(--monsoon);outline-offset:2px}
.receipt{background:var(--paper);border:1px solid var(--line);border-radius:4px;padding:18px 20px}
.receipt .total{display:flex;justify-content:space-between;align-items:baseline;gap:12px;flex-wrap:wrap;border-bottom:2px solid var(--ink);padding-bottom:10px;margin-bottom:6px}
.receipt .total b{font-family:var(--f-display);font-size:28px}
.rgroup{margin-top:12px}
.rgroup h3{font-size:12px;letter-spacing:.08em;text-transform:uppercase;color:var(--ink2);margin-bottom:4px}
.line{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:2px 14px;padding:6px 0;border-bottom:1px dashed var(--line)}
.line .l{font-weight:600}
.line .a{font-family:var(--f-mono);font-weight:600;text-align:right;white-space:nowrap}
.line .n{grid-column:1/-1;font-size:12px;color:var(--ink2);max-width:70ch}
.line.sub{border-bottom:2px solid var(--ink)}
.line.sub .l,.line.sub .a{font-weight:700}
.neg{color:var(--warn)}
.pos{color:var(--teal)}
.cols2{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px 22px}
@media (max-width:560px){.cols2{grid-template-columns:minmax(0,1fr)}}
.tabs{display:flex;gap:4px;flex-wrap:wrap;border-bottom:2px solid var(--ink);margin-bottom:14px}
.tabs button{border:0;background:none;padding:7px 10px;font-weight:700;font-size:13px;border-radius:3px 3px 0 0;cursor:pointer;color:var(--ink2)}
.tabs button[aria-selected="true"]{background:var(--ink);color:var(--paper)}
dl.facts{display:grid;grid-template-columns:minmax(0,9.5em) minmax(0,1fr);gap:8px 14px;margin:0}
dl.facts dt{font-weight:700;font-size:13px;color:var(--ink2)}
dl.facts dd{margin:0;min-width:0}
@media (max-width:480px){dl.facts{grid-template-columns:minmax(0,1fr)}}
.timeline{list-style:none;margin:0;padding:0;border-left:3px solid var(--line);display:flex;flex-direction:column;gap:2px}
.timeline li{position:relative;padding-left:14px}
.timeline li::before{content:"";position:absolute;left:-8px;top:14px;width:13px;height:13px;background:var(--terra);box-shadow:inset -3px -3px 0 var(--terra-d)}
.timeline button,.timeline .tl{width:100%;text-align:left;background:none;border:0;padding:8px 6px;border-radius:3px;display:block}
.timeline button{cursor:pointer}
.timeline button:hover{background:var(--paper2)}
.timeline .when{font-family:var(--f-mono);font-size:12px;color:var(--ink2)}
.timeline .what{font-weight:700;display:block}
.timeline .more{padding:0 6px 10px;font-size:14px;display:flex;flex-direction:column;gap:6px}
.moment{border:1px solid var(--line);border-radius:4px;background:var(--ivory)}
.moment>button{width:100%;text-align:left;background:none;border:0;padding:12px 14px;cursor:pointer;display:flex;gap:12px;align-items:baseline}
.moment .yr{font-family:var(--f-mono);font-weight:600;color:var(--terra)}
.moment .inner{padding:0 14px 14px;display:flex;flex-direction:column;gap:10px}
.moment h4{margin:0;font-size:12px;letter-spacing:.06em;text-transform:uppercase;color:var(--ink2)}
.moment ul{margin:4px 0 0;padding-left:18px}
.card{background:var(--paper);border:1px solid var(--line);border-radius:4px;padding:16px 18px}
.log{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:6px}
.log li{display:grid;grid-template-columns:4.2em minmax(0,1fr) auto;gap:10px;align-items:baseline;padding:7px 10px;background:var(--ivory);border:1px solid var(--line);border-radius:3px}
.log .tm{font-family:var(--f-mono);font-weight:600;font-size:13px}
.cmp{display:flex;flex-direction:column;gap:6px}
.cmp .rowc{display:grid;grid-template-columns:minmax(0,9em) minmax(0,1fr);gap:10px;align-items:center}
.track{position:relative;height:20px;background:var(--paper2);border-radius:2px}
.fill{position:absolute;left:0;top:0;bottom:0;background:var(--teal);border-radius:2px}
.dreamline{position:absolute;top:-4px;bottom:-4px;width:3px;background:var(--terra)}
.legend{display:flex;gap:14px;flex-wrap:wrap;font-size:12px;color:var(--ink2)}
.legend i{display:inline-block;width:12px;height:12px;vertical-align:-2px;margin-right:5px}
textarea.reflect{width:100%;min-height:220px;font-family:var(--f-mono);font-size:12.5px;line-height:1.5;border:1px solid var(--line);border-radius:3px;background:var(--ivory);padding:12px;resize:vertical}
.tag{display:inline-block;font-size:11px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;padding:2px 7px;border-radius:3px;background:var(--paper2);color:var(--ink2);border:1px solid var(--line)}
.tag.play{background:var(--leaf);color:#fff;border-color:var(--leaf)}
dialog{border:0;border-radius:4px;padding:0;max-width:min(780px,calc(100vw - 32px));width:100%;background:var(--paper);color:var(--ink);box-shadow:0 20px 60px rgba(0,0,0,.25)}
dialog::backdrop{background:rgba(36,36,42,.45)}
.dlgbody{padding:22px 24px;max-height:80vh;overflow:auto;display:flex;flex-direction:column;gap:14px}
.dlgbody table{border-collapse:collapse;width:100%;font-size:13px}
.dlgbody .tw{overflow-x:auto}
.dlgbody th,.dlgbody td{text-align:left;padding:6px 8px;border-bottom:1px solid var(--line);vertical-align:top}
.dlgbody td.a{font-family:var(--f-mono);white-space:nowrap;text-align:right}

const HOOD_NAME = Object.fromEntries(DREAM_OPTS.hood.opts);
function dreamBudget(dr){
  const g={monthly:[],fund:[],family:[],upfront:[]};const name=HOOD_NAME[dr.hood];
  if(dr.arrange==="family"){
    g.monthly.push({label:"Rent",amt:0,note:`You live in your family's home in ${name}. This assumes they own it or already pay the rent.`});
    g.monthly.push({label:"Your share of food at home",amt:4000,note:"Groceries and cooking gas you'd reasonably chip in for."});
  } else {
    const r=RENT[dr.hood][dr.arrange];
    g.monthly.push({label:dr.arrange==="alone"?"Rent, 1BHK":"Rent, your room in a shared 2BHK",amt:r,note:`Typical asking rent in ${name}. Society maintenance sometimes extra.`});
    g.monthly.push({label:"Electricity, gas, Wi-Fi, water",amt:dr.arrange==="alone"?3500:1800,note:dr.arrange==="alone"?"Yours alone. AC in summer pushes it up.":"Your share, split with flatmates."});
    g.monthly.push({label:"Groceries and cooking",amt:dr.arrange==="alone"?7000:5500,note:"Cooking most dinners at home."});
  }
  if(dr.transport==="train") g.monthly.push({label:"Train pass and autos",amt:1500,note:"A monthly second-class pass plus autos to and from the station."});
  if(dr.transport==="scooter"){g.monthly.push({label:"Two-wheeler EMI",amt:3000,note:"Loan on a ₹1 lakh scooter after the down payment."});g.monthly.push({label:"Petrol, service, insurance",amt:2500,note:"About 40 km a day."});}
  if(dr.transport==="car"){g.monthly.push({label:"Car EMI",amt:14000,note:"Loan on an ₹8 lakh hatchback after the down payment."});g.monthly.push({label:"Fuel, parking, insurance, service",amt:8000,note:"Society parking is often extra in Mumbai."});}
  g.monthly.push({label:"Eating out and ordering in",amt:{rare:1500,weekly:5000,often:12000}[dr.eat],note:"Cafés, takeaway and delivery apps."});
  g.monthly.push({label:"Weekends and fun",amt:{low:2000,mid:6000,high:15000}[dr.leisure],note:{low:"A movie, a beach walk, street food.",mid:"Gym, films, cafés with friends.",high:"Concerts, shopping, nights out, subscriptions."}[dr.leisure]});
  g.monthly.push({label:"Phone plan",amt:700,note:"Unlimited data plan."});
  g.monthly.push({label:"Clothes and personal care",amt:2500,note:"Haircuts, toiletries, a few clothes a year."});
  g.monthly.push({label:"Health insurance",amt:1100,note:"Your own cover. Many first jobs don't include it."});
  if(dr.travel!=="none") g.fund.push({label:dr.travel==="abroad"?"Travel fund: one trip abroad":"Travel fund: one trip in India",amt:dr.travel==="abroad"?12500:2500,note:dr.travel==="abroad"?"₹1.5 lakh a year, put aside monthly.":"₹30,000 a year, put aside monthly."});
  if(+dr.save>0) g.fund.push({label:"Savings",amt:+dr.save,note:"An emergency fund first, then long-term savings."});
  if(+dr.family>0) g.family.push({label:"Sent home",amt:+dr.family,note:"Money for parents, siblings or a family loan."});
  if(dr.arrange!=="family"){const r=RENT[dr.hood][dr.arrange];
    g.upfront.push({label:"Security deposit",amt:r*3,note:"Usually three to six months of rent. Returned when you leave, if all goes well."});
    g.upfront.push({label:"Broker's fee",amt:r,note:"Typically one month's rent."});
    g.upfront.push({label:"Furniture and setting up",amt:dr.arrange==="alone"?60000:25000,note:"Bed, mattress, fridge share, kitchen basics."});}
  if(dr.transport==="scooter") g.upfront.push({label:"Scooter down payment",amt:20000,note:"Plus registration and first insurance."});
  if(dr.transport==="car") g.upfront.push({label:"Car down payment",amt:150000,note:"Plus registration and first insurance."});
  const sum=a=>a.reduce((s,l)=>s+l.amt,0);
  return {g,monthly:sum(g.monthly)+sum(g.fund)+sum(g.family),upfront:sum(g.upfront)};
}

     <div class="routes">${opts.map((r,i)=>`<button class="route" aria-pressed="${i===selI}" data-route="${i}">

       <span class="tiny muted">${r.opt.monthly!=null&&st.travel!=="home"?`Every working day: about ${fmt(r.opt.monthly)} a month`:""}${r.opt.note?` · ${esc(r.opt.note)}`:""}</span></button>`).join("")}</div>

let PLAN=null;

function finishTravel(r,st,skip){const d=S.day,c=CC();clearOver();INPUT_LOCK=false;
  if(st.travel!=="home")d.flags.commute={label:r.opt.label,monthly:r.opt.monthly||0};Object.assign(d.flags,r.opt.flags||{});
  if(skip){d.min=r.arrive;d.spent+=r.fare;d.log.push({time:hhmm(d.min),label:`${r.opt.label}: ${r.total} min, ${fmt(r.fare)}`});arrive(st,r);return;}
  let i=0;const next=()=>{if(i>=r.legs.length){arrive(st,r);return;}const l=r.legs[i++];playLeg(l,i,r.legs.length,next);};next();}
function arrive(st,r){const d=S.day;if(st.deadline){let dl=toMin(st.deadline);while(dl<d.min-600)dl+=1440;const late=Math.round(d.min-dl);
    if(late>0){d.flags.late=Math.max(d.flags.late||0,late);d.log.push({time:hhmm(d.min),label:`Arrived ${late} min late`});toast(`Late by ${late} minutes`);}else toast("On time");}
  nextStep();}
function legDone(l,start,cb){const d=S.day;d.min=start+l.minAdj+l.waitAdj;d.spent+=l.fareAdj;cb();}
function playLeg(l,i,n,cb){const d=S.day,c=CC();const start=d.min;toast(`${i}/${n} · ${MODE_NAME[l.m]}: ${l.from} → ${l.to}`);
  const skipBtn=lbl=>{document.getElementById("over").innerHTML=`<div class="ov" style="right:10px;bottom:${document.getElementById("mini").hidden?10:170}px;pointer-events:auto"><button class="btn ghost sm" data-act="skipLeg">${lbl}</button></div>`;};
  SKIPLEG=()=>{clearOver();MODE=ViewMode;legDone(l,start,cb);};
  if(l.m==="walk"){const P=bStreet(ctxNow(),{len:Math.max(30,Math.min(64,l.min*4)),seed:i*31+c.id.length,destSign:l.to});setPlace(P);placePlayer(lookFor(c),P.spawn[0],P.spawn[1],P.spawn[2]);CAM.yaw=Math.PI/4;MODE=WalkMode;camFollow(V(PS.x,0,PS.z),1,P.camDist,P.pitch,true);
    const [x,z]=P.anchors.dest;const mk=addMarker(P,"exit",x,z,{label:l.to});mk.auto=true;HUDSTATE.place="Walking";HUDSTATE.objs=[{t:"Walk to "+l.to,exit:true}];hud();
    HOOK.interact=()=>{SKIPLEG=null;clearOver();legDone(l,start,cb);};skipBtn("Skip this walk");return;}
  if(l.m==="train"||l.m==="actrain"||l.m==="metro"){const P=bStation(ctxNow(),{name:l.from,kind:l.m,crowd:l.crowd});setPlace(P);placePlayer(lookFor(c),P.spawn[0],P.spawn[1],P.spawn[2]);CAM.yaw=Math.PI/4;MODE=PlatformMode;PlatformMode.t=0;PlatformMode.state="wait";PlatformMode.arriveAt=S.settings.quick?.5:2.5;camFollow(V(PS.x,0,PS.z),1,P.camDist,P.pitch,true);
    HUDSTATE.place=l.from+" station";HUDSTATE.objs=[{t:`Wait for the ${MODE_NAME[l.m].toLowerCase()} to ${l.to}`},{t:"Board at the glowing door",exit:true}];hud();
    HOOK.trainStopped=()=>{d.min+=l.waitAdj;const [x,z]=P.anchors.door;addMarker(P,"board",x,z,{label:"the train to "+l.to});hud();};
    HOOK.interact=mk=>{if(mk.kind!=="board")return;mk.on=false;const go=()=>rideLeg(l,start,cb,true);
      if(l.beat&&!d.snaps[l.beat]){runBeat(l.beat,"Platform",r=>{go();});}
      else if(l.crowd==="crush"){openDlg({who:"Platform",title:"The train is packed",text:"People hang from the doors. The next one is four minutes behind.",choices:[{label:"Push in",detail:"Energy −8"},{label:"Wait for the next one",detail:"+4 minutes"}],onChoose:k=>{if(k===0)d.energy=clamp(d.energy-8);else{d.min+=4;l.waitAdj+=4;}go();}});}
      else go();};
    skipBtn("Skip this ride");return;}
  rideLeg(l,start,cb,l.m==="bus");}
let SKIPLEG=null;
function rideLeg(l,start,cb,interior){const d=S.day,c=CC();const rail=l.m==="train"||l.m==="actrain"||l.m==="metro";
  const st=l.st&&l.st.length>1?l.st:[l.from,l.to];const n=rail||l.m==="bus"?st.length-1:1;const seg=rail?150:l.m==="bus"?90:170;const Lc=l.m==="bus"?11:20;
  let P;if(interior){P=bCarInterior(ctxNow(),{kind:l.m==="bus"?"bus":l.m,crowd:l.crowd||"busy"});buildOutside(P,{len:n*seg,rail:rail?(l.m==="metro"?"metro":"train"):false,W:l.m==="bus"?2.6:3.4,seed:start|0,
      stops:rail?st.map((s,k)=>({x:k*seg+Lc/2,name:s,crowd:k===0||k===n?8:5})):[]});
    setPlace(P);placePlayer(lookFor(c),P.spawn[0],P.spawn[1],P.spawn[2]);CAM.yaw=Math.PI/2.6;}
  else{P=bRoadRide(ctxNow(),{vehicle:l.m,look:lookFor(c)});buildOutside(P,{len:seg,rail:false,seed:start|0});setPlace(P);CAM.yaw=Math.PI*.3;}
  const dur=S.settings.quick?3:Math.max(8,Math.min(20,6+n*4));
  Object.assign(RideMode,{t:0,dur,pos:ridePos(n,seg),interior,done:false,onDone:()=>{SKIPLEG=null;clearOver();legDone(l,start,cb);}});MODE=RideMode;camFollow(RideMode.focus(),1,P.camDist,P.pitch,true);
  HUDSTATE.place=MODE_NAME[l.m];HUDSTATE.objs=[];
  document.getElementById("over").innerHTML=`<div class="ov card-g" id="ridehud" style="left:50%;top:12px;transform:translateX(-50%);pointer-events:auto;max-width:min(560px,92%)"></div><div class="ov" style="right:10px;bottom:10px;pointer-events:auto"><button class="btn ghost sm" data-act="skipRide">Skip ride · Space</button></div>`;
  SKIPLEG=()=>{RideMode.t=RideMode.dur;};
  let lastK=-1;HOOK.rideHud=(u,s)=>{d.min=start+l.waitAdj+u*l.minAdj;const k=Math.min(n,Math.round(s/seg));const el=document.getElementById("ridehud");if(!el)return;
    if(k!==lastK||Math.random()<.1){lastK=k;el.innerHTML=`<div class="small"><b>${esc(l.line||MODE_NAME[l.m])}</b> · ${esc(l.from)} → ${esc(l.to)} · <span class="num">${fmt(l.fareAdj)}</span>${l.crowd?` · ${CROWD[l.crowd]}`:""}</div>
      ${rail||l.m==="bus"?`<div class="tiny" style="margin-top:4px;display:flex;gap:6px;flex-wrap:wrap">${st.map((s,i)=>`<span style="${i===k?"font-weight:700;color:var(--terra)":i<k?"color:var(--ink2);text-decoration:line-through":""}">${esc(s)}</span>`).join(" · ")}</div>`:`<div class="tiny muted" style="margin-top:2px">${interior?"Walk around the carriage.":"Drag to look around."} ${Math.round(u*l.minAdj)} of ${l.minAdj} min</div>`}`;}};
  hud();}

function enterDrive(st,resume){const d=S.day,c=CC();const P=buildPlace(st.drive,ctxNow());setPlace(P);
  const veh=st.vehicle==="bike"?makeBike("#2C3E5A","#C8553A"):makeTaxi();const rider=makeAvatar(lookFor(c,st.vehicle==="bike"?{}:{}));setPose(rider,"sit");
  if(st.vehicle==="bike")rider.position.set(0,.5,-.05);else rider.position.set(.4,.35,.2);veh.add(rider);P.add(veh);
  const h=P.anchors.home;PS.x=h[0]+2;PS.z=h[1];PS.h=Math.PI/2;PS.v=0;veh.position.set(PS.x,0,PS.z);
  DriveMode.veh=veh;DriveMode.kind=st.vehicle;DriveMode.bumps=0;MODE=DriveMode;CAM.yaw=PS.h+Math.PI;CAM.user=0;camFollow(V(PS.x,0,PS.z),1,P.camDist*.62,.5,true);
  if(!resume||!d.goals){d.goals=clone(st.goals);d.sub=0;}
  HUDSTATE.place=st.vehicle==="bike"?"On the bike":"In the taxi";setHint("W accelerate · S brake · A/D steer · drag to look · Esc menu");
  HOOK.goal=onGoal;activateGoal();}
let GOALMK=null;
function nextDrop(){const d=S.day;const ds=CUR.drops;const p=ds[d.dropIdx%ds.length];d.dropIdx++;return p;}
function setGoalMarker(g,pos,label){if(GOALMK){GOALMK.on=false;GOALMK.g.visible=false;}GOALMK=addMarker(CUR,"goal",pos[0],pos[1],{big:true,label});GOALMK.data=g;}
function updDriveObjs(){const d=S.day;const g=d.goals[d.sub];HUDSTATE.objs=d.goals.slice(d.sub,d.sub+3).filter(x=>x.k!=="event").map((x,i)=>({t:(i===0&&g._stage==="drop"?"Drop off: ":"")+x.label,exit:i===0}));hud();}
function activateGoal(){const d=S.day;const g=d.goals[d.sub];if(!g){nextStep();return;}
  if(g.k==="event"){runBeat(g.beat,"Your phone",r=>{addGoals(r);d.sub++;activateGoal();});return;}
  if(g.beatStart&&!g._started){g._started=true;if(g.heavyRain&&d.wx==="monsoon")WX.target=1;runBeat(g.beatStart,"On the road",r=>{addGoals(r);placeGoal(g);});return;}
  placeGoal(g);}
function addGoals(r){const d=S.day;if(r&&r.addGoals){d.goals.splice(d.sub+1,0,...r.addGoals.map(x=>Object.assign({},x)));}}
function placeGoal(g){const d=S.day;let pos;if(g.at)pos=CUR.anchors[g.at];else{g._pos=g._pos||nextDrop();pos=g._pos;}
  if(g.k==="fare"&&!g._stage){g._stage="pickup";g._from=g._from||nextDrop();g._to=g._to||nextDrop();}
  if(g.k==="fare")pos=g._stage==="pickup"?g._from:g._to;
  setGoalMarker(g,pos,g.k==="fare"?(g._stage==="pickup"?"Pick up: ":"Drop: ")+g.label.replace("Fare: ",""):g.label);updDriveObjs();setWeatherFor(d.min,WX.target===1&&g.heavyRain);save();}
function onGoal(mk){const d=S.day,c=CC();const g=mk.data;if(!g||mk!==GOALMK||!mk.on)return;mk.on=false;mk.g.visible=false;
  const pay=x=>{const tired=d.energy<30;const surge=(WX.rain>.4&&c.id==="rohit")?25:0;const e=Math.round((x+surge)*(tired?.75:1));d.earned+=e;return e;};
  if(g.k==="drop"){const e=pay(g.pay);d.min+=18;d.worked+=18;d.energy=clamp(d.energy-2);toast(`Delivered · +${fmt(e)}`);blip(880,.08);d.sub++;activateGoal();}
  else if(g.k==="fare"){if(g._stage==="pickup"){g._stage="drop";d.min+=6;toast("Passenger in. Meter running.");placeGoal(g);}else{const e=pay(g.pay);d.min+=24;d.worked+=24;d.energy=clamp(d.energy-3);toast(`Fare paid · +${fmt(e)}`);blip(880,.08);d.sub++;activateGoal();}}
  else if(g.k==="pickup"){d.min+=12;toast(c.id==="rohit"?"Sana climbs on. She talks about her chemistry practical all the way.":"Zoya hops out at tuition. 'Bye, Abbu!'");d.sub++;activateGoal();}
  else if(g.k==="beat"){PS.v=0;runBeat(g.beat,g.label,r=>{addGoals(r);d.sub++;activateGoal();});}
  else if(g.k==="home"){if(g.time)advanceTo(g.time);nextStep();}
  hud();}

function renderDream(){dreamScene();$panel.innerHTML=`<div class="stack"><div class="stack-s"><span class="eyebrow">Your dream</span><h1>How do you want to live?</h1><p class="lede">Pick the life you'd want at 25. The city and the bill change as you choose.</p></div><form class="stack" onsubmit="return false">${dreamControls("d")}</form><div class="row"><button class="btn terra" data-act="select">That's the life you want. Now step into someone else's.</button></div></div>`;$below.innerHTML=receiptHTML();}

/* ---------- Profile ---------- */
const TABS=[["today","Today"],["edu","Education"],["work","Work history"],["start","Starting point"],["money","Money today"],["moments","Turning points"]];
function moneyLines(lines){let run=0;return lines.map(l=>{if(l.sub)return `<div class="line sub"><span class="l">${esc(l.sub)}</span><span class="a">${fmt(run)}</span></div>`;run+=l.amt;return `<div class="line"><span class="l">${esc(l.label)}</span><span class="a ${l.amt<0?"neg":l.amt>0?"pos":""}">${fmtS(l.amt)}</span>${l.note?`<span class="n">${esc(l.note)}</span>`:""}</div>`;}).join("")+`<div class="line sub"><span class="l">Left at the end of the month</span><span class="a">${fmt(run)}</span></div>`;}

  const P=buildPlace(key,{min:11*60,wx:WX.kind});const av=makeAvatar(lookFor(c));const sp=P.city?[P.anchors.home[0],P.anchors.home[1]]:[P.spawn[0],P.spawn[1]-(P.indoor?1.2:0)];av.position.set(sp[0],0,sp[1]);P.add(av);showcase(P,av,11*60,V(sp[0],0,sp[1]));

  if(tab==="edu")body=`<ol class="timeline">${p.education.map(e=>`<li><div class="tl"><span class="when">${e.when}</span><span class="what">${esc(e.what)}</span><span class="small">${esc(e.detail)}</span></div></li>`).join("")}</ol><hr><dl class="facts" style="margin-top:10px">${p.eduNotes.map(([k,v])=>`<dt>${k}</dt><dd>${esc(v)}</dd>`).join("")}</dl>`;
  if(tab==="work")body=`<ol class="timeline">${p.work.map((w,i)=>`<li><button aria-expanded="${S.workOpen===i}" data-act="work" data-i="${i}"><span class="when">${w.when}</span><span class="what">${esc(w.what)}</span></button>${S.workOpen===i?`<div class="more">${w.pay?`<span><b>Pay:</b> ${esc(w.pay)}</span>`:""}${w.detail?`<span>${esc(w.detail)}</span>`:""}${w.skills?`<span class="muted small"><b>Picked up:</b> ${esc(w.skills)}</span>`:""}</div>`:""}</li>`).join("")}</ol>`;
  if(tab==="start")body=`<dl class="facts">${p.start.map(([k,v])=>`<dt>${k}</dt><dd>${esc(v)}</dd>`).join("")}</dl>`;

  if(tab==="moments")body=`<div class="stack-s">${m.map((x,i)=>`<div class="moment"><button aria-expanded="${S.momentOpen===i}" data-act="moment" data-i="${i}"><span class="yr">${x.yr}</span><b>${esc(x.title)}</b></button>${S.momentOpen===i?`<div class="inner"><p>${esc(x.happened)}</p><div><h4>Options on the table</h4><ul>${x.options.map(o=>`<li>${esc(o)}</li>`).join("")}</ul></div>${x.outOfReach.length?`<div><h4>Out of reach</h4><ul>${x.outOfReach.map(o=>`<li>${esc(o)}</li>`).join("")}</ul></div>`:""}<div><h4>What ${esc(c.short)} chose</h4><p>${esc(x.chose)}</p></div><div><h4>What it depended on</h4><p>${esc(x.depended)}</p></div></div>`:""}</div>`).join("")}</div>`;
  $panel.innerHTML=`<div class="stack"><div class="stack-s"><span class="eyebrow">Meet them</span><h1>${esc(c.name)}, ${c.age}</h1><p class="muted small">${esc(c.pronouns)} · ${esc(c.role)} · ${esc(c.place)}</p></div>

/* ---------- Settlement ---------- */
let settleTimer=null;
function stopSettle(){if(settleTimer){clearInterval(settleTimer);settleTimer=null;}if(S.settle)S.settle.playing=false;}
function buildSettle(){const c=CH[S.day.char];const mo=c.month(S.day.flags);let run=0;const steps=[];for(const l of mo.lines){if(l.sub){steps.push({sub:l.sub,total:run});continue;}run+=l.amt;steps.push(Object.assign({},l,{total:run}));}
  S.settle={char:c.id,steps,owed:mo.owed,kind:mo.kind,shown:0,playing:true};}
function cubePos(i){const per=25,l=Math.floor(i/per),r=i%per;return [.2+(r%5)*1.2,.15+l*1.1,.2+Math.floor(r/5)*1.2];}
function syncCubes(){const P=CUR;if(!P||!P.cubes)return;const st=S.settle;const tot=st.shown?st.steps[st.shown-1].total:0;const n=Math.min(150,Math.floor(Math.abs(tot)/1000));const neg=tot<0;if(P.neg!==neg){P.neg=neg;while(P.cubes.length){const m=P.cubes.pop();P.fly.push({m,v:0});}}
  while(P.cubes.length>n){const m=P.cubes.pop();P.fly.push({m,v:0});m.material=M(neg?"#2C6B66":"#B4553A");}
  while(P.cubes.length<n){const i=P.cubes.length;const m=new THREE.Mesh(G_MIN,M(neg?"#B4553A":"#2C6B66"));m.scale.set(1.05,1,1.05);const [x,y,z]=cubePos(i);m.position.set(x,y+(REDUCED?0:4),z);m.userData.y=y;m.castShadow=true;P.g.add(m);P.cubes.push(m);}}
function settleFrame(dt){const P=CUR;if(!P||!P.cubes)return;for(const m of P.cubes){if(m.position.y>m.userData.y)m.position.y=Math.max(m.userData.y,m.position.y-dt*14);}
  for(let i=P.fly.length-1;i>=0;i--){const f=P.fly[i];f.v+=dt*10;f.m.position.y+=f.v*dt;f.m.rotation.y+=dt*3;if(f.m.position.y>12||REDUCED){P.g.remove(f.m);P.fly.splice(i,1);}}}
function settleStep(dir){const st=S.settle;const p=st.shown;st.shown=Math.max(0,Math.min(st.steps.length,st.shown+dir));if(p===st.shown)return false;syncCubes();const l=st.steps[st.shown-1];if(l&&!l.sub)blip(l.amt<0?300:600,.07);return true;}
function playSettle(){stopSettle();S.settle.playing=true;settleTimer=setInterval(()=>{if(!settleStep(1))stopSettle();renderSettlePanel();},S.settings.quick?600:1100);renderSettlePanel();}
function renderSettle(){if(!S.settle)buildSettle();WX.kind="sunny";WX.rain=WX.target=0;showcase(bSettle({}),null,14*60,V(3,1,3));syncCubes();renderSettlePanel();if(S.settle.playing)playSettle();}
HOOK.frame2=settleFrame;
function renderSettlePanel(){const st=S.settle;const c=CH[st.char];const shown=st.steps.slice(0,st.shown);const done=st.shown>=st.steps.length;const tot=st.shown?shown[shown.length-1].total:0;let lastG=null;
  const rows=shown.map(s=>{if(s.sub)return `<div class="line sub"><span class="l">${esc(s.sub)}</span><span class="a">${fmt(s.total)}</span></div>`;let h="";if(s.g!==lastG){h=`<h3 style="margin-top:10px;font-size:12px;letter-spacing:.08em;text-transform:uppercase;color:var(--ink2)">${esc(s.g)}</h3>`;lastG=s.g;}return h+`<div class="line"><span class="l">${esc(s.label)}</span><span class="a ${s.amt<0?"neg":s.amt>0?"pos":""}">${fmtS(s.amt)}</span>${s.note?`<span class="n">${esc(s.note)}</span>`:""}</div>`;}).join("");
  $panel.innerHTML=`<div class="stack"><div class="stack-s"><span class="eyebrow">The 1st of the month · ${esc(c.name)}</span><h1>${st.shown===0?"Pay day.":done?"What's left, and what still needs paying?":"Watch it go."}</h1><p class="small muted">${esc(st.kind)} Each block is ₹1,000; red blocks are money short.</p></div>
  <div class="row"><button class="btn ghost sm" data-act="sPlay">${st.playing?"Pause":"Play"}</button><button class="btn ghost sm" data-act="sBack" ${st.shown===0?"disabled":""}>Step back</button><button class="btn ghost sm" data-act="sStep" ${done?"disabled":""}>Next line</button><button class="btn ghost sm" data-act="sAll">Show all</button><button class="btn ghost sm" data-act="sReplay">Replay</button></div>
  <div class="card-g"><b class="num" style="font-size:20px">${fmt(tot)}</b> <span class="small muted">${tot<0?"short this month":"in the account"}</span></div>
  <div aria-live="polite">${rows||`<p class="muted">The money is about to arrive.</p>`}</div>
  ${done?`<div class="card stack-s" style="background:${tot<0?"#F6E3DC":"var(--ivory)"}"><h3>Left at the end of the month: <span class="num">${fmt(tot)}</span></h3><p class="small">${tot<0?"This month doesn't close. Something gets delayed, borrowed or skipped.":tot<3000?"Enough to get through, not enough for one bad week.":"Some room. Here's what's still waiting:"}</p>${st.owed.map(o=>`<div class="line"><span class="l">${esc(o.label)}</span><span class="a">${o.amt==null?"—":fmt(o.amt)}</span><span class="n">${esc(o.note)}</span></div>`).join("")}</div>
  <div class="row"><button class="btn terra" data-act="toFutures">See possible futures</button><button class="btn ghost" data-act="select">Choose another life</button></div>`:""}
  <p class="tiny muted">Money spent during the day you played is already inside these monthly lines. ${BASIS}.</p></div>`;}

/* ---------- Futures ---------- */
function branchFor(c,f){return c.branches.find(b=>b.cond(f||{}));}
const val=(v,f)=>typeof v==="function"?v(f||{}):v;
function renderFutures(){const c=CH[S.cur];const f=(S.played[c.id]||{}).flags||{};const br=branchFor(c,f);const yr=S.futureYear;const y=br["y"+yr];
  WX.kind="sunny";WX.rain=WX.target=0;const P=buildPlace(y.place,{min:11*60,wx:"sunny"});const av=makeAvatar(lookFor(c,yr===15?{grey:true}:{}));const sp=P.city?P.anchors.home:[P.spawn[0],P.spawn[1]-(P.indoor?1.2:0)];av.position.set(sp[0],0,sp[1]);P.add(av);showcase(P,av,11*60,V(sp[0],0,sp[1]));

  <div class="card stack-s"><h3>Another way it could have gone</h3>${others.map(o=>`<p class="small"><b>${esc(o.title)}:</b> at ${o["y"+yr].age}, ${esc(o["y"+yr].role.toLowerCase())}. About ${fmt(o["y"+yr].available)} a month free for life.</p>`).join("")}
   <div class="row"><button class="btn ghost sm" data-act="replay" data-id="${c.pivot}" ${S.day&&S.day.char===c.id&&S.day.snaps&&S.day.snaps[c.pivot]?"":"disabled"}>Replay the decision that shaped this</button></div></div>
  <p class="tiny muted">In today's rupees. Effort doesn't guarantee an outcome; support and luck shaped every path here.</p>
  <div class="row"><button class="btn terra" data-act="toCompare">Back to your dream</button><button class="btn ghost" data-act="select">Live another day</button></div></div>`;}

/* ---------- Compare ---------- */
function compareRows(){const b=dreamBudget(S.dream);const rows=ALL().map(c=>{const pl=S.played[c.id];const f=pl?pl.flags:{};const br=branchFor(c,f);
  return {c,played:!!pl,br,pts:[{k:"Today",age:c.age,v:c.available},...(pl?[{k:"In 5 years",age:br.y5.age,v:br.y5.available},{k:"In 15 years",age:br.y15.age,v:br.y15.available}]:[])]};});return {b,rows};}
function renderCompare(){const {b,rows}=compareRows();dreamScene();const mx=Math.max(b.monthly,...rows.flatMap(r=>r.pts.map(p=>p.v)))*1.05;
  const sorted=rows.slice().sort((a,z)=>(z.played-a.played));
  const bar=p=>{const gap=p.v-b.monthly;return `<div class="rowc"><span class="small"><b>${p.k}</b>, age ${p.age}</span><div><div class="track" role="img" aria-label="${fmt(p.v)} against ${fmt(b.monthly)}"><div class="fill" style="width:${Math.min(100,p.v/mx*100)}%"></div><div class="dreamline" style="left:calc(${b.monthly/mx*100}% - 1px)"></div></div><span class="tiny ${gap<0?"neg":"pos"}"><b class="num">${fmt(p.v)}</b> free · ${gap<0?`<b class="num">${fmt(-gap)}</b> short`:`<b class="num">${fmt(gap)}</b> to spare`}</span></div></div>`;};
  $panel.innerHTML=`<div class="stack"><div class="stack-s"><span class="eyebrow">Return to your dream</span><h1>Your life costs ${fmt(b.monthly)} a month.</h1><p class="lede">The bar is what each person has free each month; the terracotta line is your dream. Lives you've played show their futures too.</p></div>
  <div class="legend"><span><i style="background:var(--teal)"></i>Free each month</span><span><i style="background:var(--terra)"></i>Your dream</span></div>
  ${sorted.map(r=>`<div class="card stack-s"><div class="row" style="justify-content:space-between"><h3>${esc(r.c.name)} · ${esc(r.c.role)}</h3>${r.played?`<span class="tag play">${esc(r.br.title)}</span>`:`<button class="link" data-act="live" data-id="${r.c.id}">Play this day</button>`}</div><div class="cmp">${r.pts.map(bar).join("")}</div>
   <div class="tiny muted">${esc(r.c.hours.label)}. Cost of getting here: <b class="num">${fmt(r.c.entryCost.amt)}</b>. ${esc(r.c.entryCost.note)}</div></div>`).join("")}
  <details class="card"><summary><b>Change your dream</b></summary><form class="stack" style="margin-top:12px" onsubmit="return false">${dreamControls("c")}</form></details>
  <div class="stack-s"><h2>What matters enough to you to plan for it?</h2><p class="small muted">Copy this into your notes. It isn't financial advice or a career recommendation.</p><textarea class="reflect" id="reflect" readonly aria-label="Your reflection">${esc(reflection())}</textarea><div class="row"><button class="btn teal" data-act="copy">Copy reflection</button><span class="tiny muted" id="copied" role="status"></span></div></div></div>`;}
function reflection(){const {b,rows}=compareRows();const d=S.dream;const L=["HOWTOLIFE · MY REFLECTION","","The life I said I wanted:"];
  for(const [k,o] of Object.entries(DREAM_OPTS))L.push("  "+o.label+": "+o.opts.find(x=>x[0]===d[k])[1]);L.push("  Monthly cost: "+fmt(b.monthly),"  Up front: "+fmt(b.upfront),"","Lives I played:");
  rows.filter(r=>r.played).forEach(r=>{L.push("  "+r.c.name+" ("+r.c.role+") · path: "+r.br.title);r.pts.forEach(p=>L.push("    "+p.k+", age "+p.age+": "+fmt(p.v)+" free ("+(p.v>=b.monthly?"covers it":"short by "+fmt(b.monthly-p.v))+")"));});
  if(!rows.some(r=>r.played))L.push("  None yet.");
  L.push("","Questions I want to research:","  1. What do people in the careers I like actually earn in their first three years? Who can I ask?","  2. What would getting there cost: fees, exams, coaching, time without income?","  3. Which part of my dream matters most, and which could wait?","  4. Who could support me, and what would I ask them for?","","All figures are illustrative assumptions from a game with fictional characters. Check real numbers with people in those jobs and official sources.");return L.join("\n");}

/* ---------- Numbers ---------- */
function renderNumbers(){const b=dreamBudget(S.dream);const tbl=(t,ls)=>`<h3>${esc(t)}</h3><div class="tw"><table><thead><tr><th>Item</th><th>Amount</th><th>Status</th></tr></thead><tbody>${ls.map(l=>`<tr><td>${esc(l.label)}${l.note?`<br><span class="tiny muted">${esc(l.note)}</span>`:""}</td><td class="a">${fmtS(l.amt)}</td><td class="tiny">Illustrative</td></tr>`).join("")}</tbody></table></div>`;
  const fares=[];ALL().forEach(c=>Object.values(c.routes||{}).forEach(R=>R.options.forEach(o=>o.legs.forEach(l=>{if(l.fare)fares.push({label:`${c.short}: ${MODE_NAME[l.m]} ${l.from} → ${l.to}, ${l.min} min`,amt:-l.fare,note:""});}))));

  ${tbl("Your dream",[...b.g.monthly,...b.g.fund,...b.g.family,...b.g.upfront])}${ALL().map(c=>tbl(c.name+": a typical month",c.month({}).lines.filter(l=>!l.sub))).join("")}${tbl("Journey fares (one way)",fares)}`;}

/* ---------- Events ---------- */
document.addEventListener("click",e=>{const a=e.target.closest("[data-act],[data-route]");if(!a)return;
  if(a.dataset.route!=null&&PLAN){PLAN.pick(+a.dataset.route);return;}
  const act=a.dataset.act;switch(act){
    case "select":go("select");break;case "dream":go("dream");break;
    case "pick":S.sel=a.dataset.id;renderSelect();save();setTimeout(()=>{const b=document.querySelector(`.av[data-id="${S.sel}"]`);b&&b.focus({preventScroll:true});},0);break;
    case "outfit":S.outfit[S.sel]=a.dataset.v;renderSelect();break;
    case "wx":S.wx[S.sel]=a.dataset.v;renderSelect();break;
    case "live":stopSettle();S.settle=null;startDay(a.dataset.id);break;
    case "resume":if(S.day&&!S.day.done){S.screen="play";layout();WX.kind=S.day.wx;runStep(true);}break;
    case "meet":closeDlg();S.profileOf=a.dataset.id;S.profileTab="today";S.momentOpen=null;S.workOpen=null;go("profile");break;
    case "tab":S.profileTab=a.dataset.tab;S.momentOpen=null;renderProfile();document.getElementById("tab-"+S.profileTab)?.focus();break;
    case "work":S.workOpen=S.workOpen===+a.dataset.i?null:+a.dataset.i;renderProfile();break;
    case "moment":S.momentOpen=S.momentOpen===+a.dataset.i?null:+a.dataset.i;renderProfile();break;
    case "interact":if(PROMPT.mk&&HOOK.interact&&MODE!==DriveMode)HOOK.interact(PROMPT.mk);break;
    case "routePlay":if(PLAN)finishTravel(PLAN.sel(),PLAN.st,false);break;
    case "routeSkip":if(PLAN)finishTravel(PLAN.sel(),PLAN.st,true);break;
    case "skipLeg":case "skipRide":SKIPLEG&&SKIPLEG();break;
    case "pause":openPause();break;
    case "replay":clearOver();replayFrom(a.dataset.id);break;
    case "toSettle":S.settle=null;go("settle");break;
    case "sPlay":if(S.settle.playing){stopSettle();renderSettlePanel();}else{if(S.settle.shown>=S.settle.steps.length){S.settle.shown=0;syncCubes();}playSettle();}break;
    case "sStep":stopSettle();settleStep(1);renderSettlePanel();break;
    case "sBack":stopSettle();settleStep(-1);renderSettlePanel();break;
    case "sAll":stopSettle();while(settleStep(1));renderSettlePanel();break;
    case "sReplay":S.settle.shown=0;syncCubes();playSettle();break;
    case "toFutures":stopSettle();S.futureYear=5;go("futures");break;
    case "year":S.futureYear=+a.dataset.y;renderFutures();break;
    case "toCompare":go("compare");break;
    case "copy":{const ta=document.getElementById("reflect");const sel=()=>{ta.select();document.getElementById("copied").textContent="Selected. Press Ctrl/Cmd+C to copy.";};try{navigator.clipboard.writeText(ta.value).then(()=>{document.getElementById("copied").textContent="Copied.";},sel);}catch(err){sel();}break;}
    case "numbers":renderNumbers();document.getElementById("numbers").showModal();break;
    case "closeNum":document.getElementById("numbers").close();break;
    case "quick":S.settings.quick=!S.settings.quick;renderSteps();save();toast(S.settings.quick?"3-min mode: journeys are skipped automatically":"Journeys are playable again");break;
    case "sound":S.settings.sound=!S.settings.sound;renderSteps();save();blip(660);break;
    case "restart":if(a.dataset.confirm==="1"){const st=S.settings;S=DEF();S.settings=st;save();go("select");}else{a.dataset.confirm="1";a.textContent="Tap again to erase progress";setTimeout(()=>{a.dataset.confirm="";a.textContent="Start over";},3500);}break;
  }});
document.addEventListener("change",e=>{const i=e.target;if(!i.dataset||!i.dataset.dream)return;S.dream[i.dataset.dream]=i.value;save();
  if(S.screen==="dream"){$below.innerHTML=receiptHTML();dreamScene();}
  if(S.screen==="compare"){const y=window.scrollY;renderCompare();const det=$panel.querySelector("details");if(det)det.open=true;const el=$panel.querySelector(`input[name="${i.name}"][value="${i.value}"]`);el&&el.focus({preventScroll:true});window.scrollTo(0,y);}});
document.addEventListener("keydown",e=>{
  if(S.screen==="select"&&!e.target.closest("input,textarea")){const i=ORDER.indexOf(S.sel);
    if(e.key==="ArrowRight"||e.key==="ArrowDown"&&e.target.closest(".roster")){S.sel=ORDER[(i+1)%12];renderSelect();e.preventDefault();setTimeout(()=>document.querySelector(`.av[data-id="${S.sel}"]`)?.focus({preventScroll:true}),0);}
    else if(e.key==="ArrowLeft"||e.key==="ArrowUp"&&e.target.closest(".roster")){S.sel=ORDER[(i+11)%12];renderSelect();e.preventDefault();setTimeout(()=>document.querySelector(`.av[data-id="${S.sel}"]`)?.focus({preventScroll:true}),0);}
    else if(e.key==="Enter"&&!e.target.closest("button")){startDay(S.sel);}}
  if(e.target.getAttribute&&e.target.getAttribute("role")==="tab"&&(e.key==="ArrowRight"||e.key==="ArrowLeft")){const tabs=[...e.target.parentElement.querySelectorAll("[role=tab]")];const i=tabs.indexOf(e.target);tabs[(i+(e.key==="ArrowRight"?1:-1)+tabs.length)%tabs.length].click();e.preventDefault();}
  if(S.screen==="play"&&e.code==="Space"&&SKIPLEG&&MODE===RideMode){e.preventDefault();}});
const _hf=HOOK.frame;HOOK.frame=(dt,t)=>{_hf&&_hf(dt,t);if(S.screen==="settle")settleFrame(dt);};

/* Boot */
(function boot(){if(S.screen==="play"&&!(S.day&&!S.day.done))S.screen="select";if(["settle","futures"].includes(S.screen)&&!S.cur)S.screen="select";if(S.screen==="settle"&&!S.day)S.screen="select";if(S.screen==="profile"&&!S.profileOf)S.screen="select";
  if(S.screen==="play"){S.screen="play";layout();WX.kind=S.day.wx;runStep(true);}else go(S.screen);})();
</script>
